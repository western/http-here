

<div class="container">



        <div class="row" style="padding:50px 0 0 0;">
            <h2>
                <a href="javascript:history.back();" title="Return back"><i class="bi bi-arrow-left-square"></i></a>
                &nbsp;
                <i class="bi bi-search"></i>
                Search result
            </h2>
        </div>
        
        
        <div class="row" style="padding:20px 0 0 0;">

            <div class="col-12">
                
                <div class="input-group input-group-lg mb-3">
                    
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="" aria-label="" id="search_input" value="{{.s}}" >
                        <button class="btn btn-outline-secondary" type="button" id="search_button">Search</button>
                    </div>
                    
                </div>
                
            </div>
            
            
            
        </div>
        
        
        
        
        
        <table class="table file-table table-hover ">
            <thead>
                <tr>
                    
                    <th>folder</th>
                    <th></th>
                    <th>ext</th>
                    <th>size</th>
                    <th>modified</th>
                    
                </tr>
            </thead>
            <tbody>

                
                {{if .arg_usedb}}
                {{else}}
                    <tr>
                        <td colspan="5">
                            You should enable database for search
                        </td>
                    </tr>
                {{end}}
                
                {{range .result_list}}
                    
                    <tr>
                        <th>
                            <a href="{{.OnlyFold}}">{{.OnlyFoldHtml}}</a>
                        </th>
                        <td>
                            <a href="{{.FullPath}}">{{.NameHtml}}</a>
                        </td>
                        <td>{{.EXT}}</td>
                        <td>{{.SizeHuman}}</td>
                        <td>{{.ModTime}}</td>
                        
                    </tr>

                {{end}}

            </tbody>
        </table>




    





</div>
